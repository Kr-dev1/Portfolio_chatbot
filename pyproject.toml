[project]
name = "portfolio-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kasturirangan", email = "kasturirangan20@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.12",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "unstructured[pdf]>=0.27.8",
    "unstructured-client>=0.46.2",
    "markdown>=3.11",
    "langchain-qdrant>=1.1.0",
    "flashrank>=0.2.10",
    "sqlmodel>=0.0.47",
    "psycopg2-binary>=2.9.13",
]

[project.scripts]
portfolio-chat = "portfolio_chat:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
